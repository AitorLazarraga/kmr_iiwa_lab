# Use of /** so that the configurations hold for controller
# managers regardless of their namespace. Usefull in multi-robot setups.
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true # can be removed from Kilted onward

    # ROS 2 control broadcasters
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # ROS 2 control controllers
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    base_velocity_controller:
      #type: forward_command_controller/ForwardCommandController
      #type: gpio_controllers/GpioCommandController
      type: gz_virtual_base_velocity_controller/GazeboVirtualBaseVelocityController

# ROS 2 control controllers
/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - kmr_iiwa_A1
      - kmr_iiwa_A2
      - kmr_iiwa_A3
      - kmr_iiwa_A4
      - kmr_iiwa_A5
      - kmr_iiwa_A6
      - kmr_iiwa_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

/**/forward_position_controller:
  ros__parameters:
    joints:
      - kmr_iiwa_A1
      - kmr_iiwa_A2
      - kmr_iiwa_A3
      - kmr_iiwa_A4
      - kmr_iiwa_A5
      - kmr_iiwa_A6
      - kmr_iiwa_A7
    interface_name: position

# /**/base_velocity_controller:
#   ros__parameters:
#     joints:
#       - virtual_joint_x
#       - virtual_joint_y
#       - virtual_joint_yaw
#     interface_name: velocity
/**/base_velocity_controller:
  ros__parameters:
    odom_topic: /kmr_iiwa/odom
    odom_frame_id: world
    base_frame_id: kmp_base_link
    cmd_vel_topic: /kmr_iiwa/cmd_vel
    cmd_vel_timeout: 0.5
